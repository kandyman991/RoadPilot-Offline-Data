name: R2 test-only graph upload credential handoff

# Only an explicit owner-triggered run on main, no pull_request, push or checkout.
on:
  workflow_dispatch:
    inputs:
      legion_recipient_public_key_b64:
        description: One-time X25519 public key from the authorized Legion (base64)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: roadpilot-r2-test-graph-credential-handoff
  cancel-in-progress: false

jobs:
  one-time-encrypted-handoff:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare audited crypto dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r2-crypto"
          "$RUNNER_TEMP/r2-crypto/bin/python" -m pip install --quiet --disable-pip-version-check "cryptography>=45,<48"

      - name: Encrypt narrowly-scoped upload credentials for the Legion
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY: ${{ inputs.legion_recipient_public_key_b64 }}
          TEST_GRAPH_R2_ACCESS_KEY_ID: ${{ secrets.ROADPILOT_R2_ACCESS_KEY_ID }}
          TEST_GRAPH_R2_SECRET_ACCESS_KEY: ${{ secrets.ROADPILOT_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Never display tokens, encrypted payload, or the derived symmetric key.
          "$RUNNER_TEMP/r2-crypto/bin/python" - <<'PY'
          import base64
          import json
          import os
          import time
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          def required(name):
              value = os.getenv(name, "").strip()
              if not value:
                  raise SystemExit("R2 configuration incomplete; check repository secrets")
              return value

          try:
              recipient_bytes = base64.b64decode(required("RECIPIENT_PUBLIC_KEY"), validate=True)
              recipient = x25519.X25519PublicKey.from_public_bytes(recipient_bytes)
          except (ValueError, TypeError):
              raise SystemExit("Invalid one-time X25519 public key")
          ephemeral = x25519.X25519PrivateKey.generate()
          secret = ephemeral.exchange(recipient)
          aes_key = HKDF(
              algorithm=hashes.SHA256(), length=32, salt=None,
              info=b"roadpilot-r2-test-only-legion-handoff-v1",
          ).derive(secret)
          now = int(time.time())
          plain = {
              "schema": "roadpilot.r2.test-only-credential-handoff.v1",
              "accountId": "06feb351c2243add77c866ce1c9ceccf",
              "bucket": "roadpilot-test-graphs",
              "accessKeyId": required("TEST_GRAPH_R2_ACCESS_KEY_ID"),
              "secretAccessKey": required("TEST_GRAPH_R2_SECRET_ACCESS_KEY"),
              "issuedAt": now,
              "expiresAt": now + 1800,
          }
          nonce = os.urandom(12)
          ciphertext = AESGCM(aes_key).encrypt(
              nonce, json.dumps(plain, separators=(",", ":")).encode("utf-8"),
              b"roadpilot-r2-test-only-legion-handoff-v1",
          )
          output = {
              "schema": "roadpilot.r2.encrypted-handoff.v1",
              "ephemeralPublicKey": base64.b64encode(ephemeral.public_key().public_bytes(
                  serialization.Encoding.Raw, serialization.PublicFormat.Raw,
              )).decode(),
              "nonce": base64.b64encode(nonce).decode(),
              "ciphertext": base64.b64encode(ciphertext).decode(),
          }
          dest = Path(os.environ["RUNNER_TEMP"]) / "roadpilot-r2-encrypted-handoff.json"
          dest.write_text(json.dumps(output, separators=(",", ":")) + "\n")
          dest.chmod(0o600)
          print("One-time credential envelope encrypted for the Legion; no secrets printed.")
          PY

      - name: Deliver only ciphertext as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadpilot-r2-encrypted-handoff
          path: ${{ runner.temp }}/roadpilot-r2-encrypted-handoff.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
