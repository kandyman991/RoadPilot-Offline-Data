name: Validate offline-data repository

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/build-routing-pack.yml"
      - "requirements-routing.txt"
      - "docs/routing-packs-v1.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install routing Python dependencies
        run: python -m pip install -r requirements-routing.txt

      - name: Compile Python tooling
        run: python -m py_compile tools/*.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root in ("config", "schemas"):
              for path in Path(root).rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print("valid JSON:", path)
          PY

      - name: Validate region configs
        shell: bash
        run: |
          set -euo pipefail
          for file in config/regions/*.json; do
            python tools/validate_region_config.py --config "$file"
          done

      - name: Smoke-test Geofabrik Graph Studio discovery
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/graph-studio-geofabrik"
          python tools/graph_studio_regions.py --cache-dir "$cache" catalog > "$RUNNER_TEMP/catalog.json"
          python tools/graph_studio_regions.py --cache-dir "$cache" preview             --geofabrik-id italy/nord-est             --buffer-km 25 > "$RUNNER_TEMP/nord-est-preview.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          catalog = json.loads((root / "catalog.json").read_text())
          preview = json.loads((root / "nord-est-preview.json").read_text())

          assert any(item["id"] == "italy/nord-est" for item in catalog)
          assert preview["geofabrikId"] == "italy/nord-est"
          assert preview["borderBufferKm"] == 25
          assert any(item["primary"] and item["id"] == "italy/nord-est" for item in preview["sources"])
          assert len(preview["sources"]) > 1
          print("discovered sources:", ", ".join(item["id"] for item in preview["sources"]))
          PY

      - name: Smoke-test connectivity pair manifest
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/connectivity-pair"
          mkdir -p "$root/a" "$root/b"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "connectivity-pair"
          fp_a = "sha256:" + "a" * 64
          fp_b = "sha256:" + "b" * 64
          boundary_ab = "sha256:" + "c" * 64
          boundary_ba = "sha256:" + "d" * 64

          index_a = {
              "schema": "roadpilot-graph-index",
              "schemaVersion": 1,
              "regionId": "region-a",
              "packageVersion": "2026.10.06-a",
              "graphTileFingerprint": fp_a,
              "internalFingerprint": "sha256:" + "e" * 64,
              "tileCount": 1,
              "boundaries": [
                  {"sourceId": "country/region-b", "fingerprint": boundary_ab, "tileCount": 1}
              ],
              "tiles": [],
          }
          index_b = {
              "schema": "roadpilot-graph-index",
              "schemaVersion": 1,
              "regionId": "region-b",
              "packageVersion": "2026.10.06-b",
              "graphTileFingerprint": fp_b,
              "internalFingerprint": "sha256:" + "f" * 64,
              "tileCount": 1,
              "boundaries": [
                  {"sourceId": "country/region-a", "fingerprint": boundary_ba, "tileCount": 1}
              ],
              "tiles": [],
          }
          manifest_a = {
              "regionId": "region-a",
              "packageVersion": "2026.10.06-a",
              "graphFingerprint": fp_a,
              "source": {"primaryGeofabrikId": "country/region-a"},
              "graphIndex": {"fileName": "a-graph-index.json"},
          }
          manifest_b = {
              "regionId": "region-b",
              "packageVersion": "2026.10.06-b",
              "graphFingerprint": fp_b,
              "source": {"primaryGeofabrikId": "country/region-b"},
              "graphIndex": {"fileName": "b-graph-index.json"},
          }

          (root / "a" / "a-graph-index.json").write_text(json.dumps(index_a))
          (root / "a" / "a-manifest.json").write_text(json.dumps(manifest_a))
          (root / "b" / "b-graph-index.json").write_text(json.dumps(index_b))
          (root / "b" / "b-manifest.json").write_text(json.dumps(manifest_b))
          PY

          python tools/build_connectivity_pair_manifest.py             --from-manifest "$root/a/a-manifest.json"             --to-manifest "$root/b/b-manifest.json"             --output "$root/a__b-connectivity.json"

          python tools/validate_cross_region_connectivity.py             --artifact "$root/a__b-connectivity.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "connectivity-pair"
          artifact = json.loads((root / "a__b-connectivity.json").read_text())
          assert artifact["pairId"] == "region-a__region-b"
          assert artifact["fromBoundarySourceId"] == "country/region-b"
          assert artifact["toBoundarySourceId"] == "country/region-a"
          assert artifact["fromBoundaryFingerprint"] == "sha256:" + "c" * 64
          assert artifact["toBoundaryFingerprint"] == "sha256:" + "d" * 64
          assert artifact["bindingState"] == "STABLE_PHYSICAL"
          assert artifact["validationState"] == "UNPROVEN"
          assert artifact["candidates"] == []
          print("connectivity pair manifest smoke test passed")
          PY

      - name: Install Osmium
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version | head -n1

      - name: Smoke-test stable frontier road inventory
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frontier-inventory"
          mkdir -p "$root"

          cat > "$root/a.geojson" <<'EOF'
          {"type":"Polygon","coordinates":[[[0,0],[1,0],[1,1],[0,1],[0,0]]]}
          EOF
          cat > "$root/b.geojson" <<'EOF'
          {"type":"Polygon","coordinates":[[[1,0],[2,0],[2,1],[1,1],[1,0]]]}
          EOF
          cat > "$root/roads.osm" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <osm version="0.6" generator="roadpilot-test">
            <node id="1" lat="0.5" lon="0.5"/>
            <node id="2" lat="0.5" lon="1.0"/>
            <node id="3" lat="0.5" lon="1.5"/>
            <node id="4" lat="0.25" lon="0.2"/>
            <node id="5" lat="0.25" lon="0.8"/>
            <node id="6" lat="0.2" lon="1.0"/>
            <node id="7" lat="0.8" lon="1.0"/>
            <way id="100">
              <nd ref="1"/><nd ref="2"/><nd ref="3"/>
              <tag k="highway" v="primary"/>
              <tag k="name" v="Cross Road"/>
              <tag k="ref" v="A1"/>
            </way>
            <way id="101">
              <nd ref="4"/><nd ref="5"/>
              <tag k="highway" v="residential"/>
              <tag k="name" v="A-only Road"/>
            </way>
            <way id="102">
              <nd ref="6"/><nd ref="7"/>
              <tag k="highway" v="secondary"/>
              <tag k="name" v="Border Road"/>
            </way>
          </osm>
          EOF

          python tools/build_frontier_road_inventory.py \
            --pair-manifest "$RUNNER_TEMP/connectivity-pair/a__b-connectivity.json" \
            --from-polygon "$root/a.geojson" \
            --to-polygon "$root/b.geojson" \
            --osm-source "$root/roads.osm" \
            --output "$root/inventory.json"

          python tools/validate_frontier_road_inventory.py \
            --inventory "$root/inventory.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "frontier-inventory"
          inventory = json.loads((root / "inventory.json").read_text())
          roads = inventory["roads"]
          assert {road["wayId"] for road in roads} == {100, 102}, roads
          by_way = {road["wayId"]: road for road in roads}
          assert by_way[100]["crossingKind"] == "CROSSING"
          assert by_way[100]["routingTags"]["ref"] == "A1"
          assert by_way[102]["crossingKind"] == "FRONTIER_OVERLAP"
          assert by_way[102]["overlapLengthMeters"] > 0
          assert all("graphId" not in road for road in roads)
          print("stable frontier road inventory smoke test passed")
          PY

      - name: Smoke-test independent Valhalla frontier correlation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frontier-correlation"
          mkdir -p "$root/bin" "$root/from" "$root/to"
          printf 'graph-a' > "$root/from/a.tar"
          printf 'graph-b' > "$root/to/b.tar"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "frontier-correlation"
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          a_sha = digest(root / "from" / "a.tar")
          b_sha = digest(root / "to" / "b.tar")
          a = {
              "schema": "roadpilot-routing-pack",
              "schemaVersion": 1,
              "regionId": "region-a",
              "regionName": "Region A",
              "packageVersion": "a-v1",
              "graphFingerprint": "sha256:" + a_sha,
              "source": {"primaryGeofabrikId": "country/region-a"},
              "artifact": {"fileName": "a.tar", "sha256": a_sha},
              "graphIndex": {
                  "boundaryFingerprints": {
                      "country/region-b": "sha256:" + "c" * 64
                  }
              },
          }
          b = {
              "schema": "roadpilot-routing-pack",
              "schemaVersion": 1,
              "regionId": "region-b",
              "regionName": "Region B",
              "packageVersion": "b-v1",
              "graphFingerprint": "sha256:" + b_sha,
              "source": {"primaryGeofabrikId": "country/region-b"},
              "artifact": {"fileName": "b.tar", "sha256": b_sha},
              "graphIndex": {
                  "boundaryFingerprints": {
                      "country/region-a": "sha256:" + "d" * 64
                  }
              },
          }
          (root / "from" / "manifest.json").write_text(json.dumps(a))
          (root / "to" / "manifest.json").write_text(json.dumps(b))
          PY

          cat > "$root/bin/valhalla_build_config" <<'PY'
          #!/usr/bin/env python3
          import json
          import sys
          args = sys.argv[1:]
          tile_extract = args[args.index("--mjolnir-tile-extract") + 1]
          tile_dir = args[args.index("--mjolnir-tile-dir") + 1]
          print(json.dumps({"mjolnir":{"tile_extract":tile_extract,"tile_dir":tile_dir}}))
          PY
          chmod +x "$root/bin/valhalla_build_config"

          cat > "$root/bin/valhalla_service" <<'PY'
          #!/usr/bin/env python3
          import json
          import sys

          config = json.load(open(sys.argv[1]))
          request = json.loads(sys.argv[3])
          point = request["locations"][0]
          is_a = config["mjolnir"]["tile_extract"].endswith("/a.tar")
          shift = 0.0002 if is_a else -0.0002
          base = 1000 if is_a else 2000

          def edge(way_id, offset, graph_id, heading):
              motorcycle = not (way_id == 100 and not is_a)
              return {
                  "edge_id": {"value": graph_id},
                  "edge_info": {
                      "way_id": way_id,
                      "names": ["Road " + str(way_id)],
                  },
                  "edge": {
                      "classification": {"classification": "primary"},
                      "access": {"car": True, "motorcycle": motorcycle},
                      "use": "road",
                  },
                  "percent_along": 0.5,
                  "heading": heading,
                  "correlated_lat": point["lat"],
                  "correlated_lon": point["lon"] + offset,
              }

          # Wrong way 999 is closest on purpose. Stable way matches must be ranked
          # first as evidence, but this wrong-way candidate must remain in output.
          result = [{
              "input_lat": point["lat"],
              "input_lon": point["lon"],
              "edges": [
                  edge(999, 0.00001, base + 1, 5),
                  edge(100, shift, base + 2, 275 if is_a else 95),
                  edge(102, shift * 1.5, base + 3, 95),
              ],
          }]
          print(json.dumps(result))
          PY
          chmod +x "$root/bin/valhalla_service"

          PATH="$root/bin:$PATH" python tools/correlate_frontier_roads.py \
            --inventory "$RUNNER_TEMP/frontier-inventory/inventory.json" \
            --from-manifest "$root/from/manifest.json" \
            --to-manifest "$root/to/manifest.json" \
            --output "$root/correlations.json"

          python tools/validate_frontier_road_correlations.py \
            --artifact "$root/correlations.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "frontier-correlation"
          data = json.loads((root / "correlations.json").read_text())
          assert len(data["correlations"]) == 2
          by_way = {item["wayId"]: item for item in data["correlations"]}

          for way_id in (100, 102):
              item = by_way[way_id]
              for side in ("fromGraph", "toGraph"):
                  result = item[side]
                  assert result["status"] == "CORRELATED"
                  assert result["candidateCount"] == 3
                  assert result["sameWayCandidateCount"] == 1
                  assert result["candidates"][0]["wayId"] == way_id
                  assert result["candidates"][0]["wayMatch"] is True
                  assert any(candidate["wayId"] == 999 for candidate in result["candidates"])

              a = item["fromGraph"]["candidates"][0]["correlatedCoordinate"]
              b = item["toGraph"]["candidates"][0]["correlatedCoordinate"]
              assert a != b

          # Large heading disagreement is retained as evidence; it is not a
          # pre-Valhalla rejection criterion in this stage.
          assert by_way[100]["fromGraph"]["candidates"][0]["headingDegrees"] == 275
          print("independent Valhalla frontier correlation smoke test passed")
          PY

      - name: Smoke-test lossless crossing candidate generation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frontier-correlation"

          python tools/build_crossing_candidates.py \
            --correlations "$root/correlations.json" \
            --output "$root/candidates.json"

          python tools/validate_crossing_candidates.py \
            --artifact "$root/candidates.json"

          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "frontier-correlation"
          data = json.loads((root / "candidates.json").read_text())
          assert data["frontierRoadCount"] == 2
          assert data["candidateCount"] == 18
          assert data["unresolvedFrontierRoadIds"] == []

          counts = Counter(candidate["stableWayId"] for candidate in data["candidates"])
          assert counts == {100: 9, 102: 9}

          for way_id in (100, 102):
              group = [candidate for candidate in data["candidates"] if candidate["stableWayId"] == way_id]
              assert [candidate["candidateRank"] for candidate in group] == list(range(9))
              best = group[0]
              assert best["fromEdge"]["wayId"] == way_id
              assert best["toEdge"]["wayId"] == way_id
              assert best["evidence"]["bothMatchStableWay"] is True
              assert best["evidence"]["tier"] == 0

              # All 3x3 combinations survive, including mismatched OSM ways.
              pairs = {
                  (candidate["fromEdge"]["wayId"], candidate["toEdge"]["wayId"])
                  for candidate in group
              }
              assert (999, 999) in pairs
              assert (way_id, 999) in pairs
              assert (999, way_id) in pairs

          best_100 = [candidate for candidate in data["candidates"] if candidate["stableWayId"] == 100][0]
          assert best_100["evidence"]["headingDeltaDegrees"] == 180
          assert best_100["toEdge"]["access"]["motorcycle"] is False

          # Neither the 180-degree heading disagreement nor access metadata is
          # allowed to delete/demote the stable-way pair before route proof.
          assert best_100["candidateRank"] == 0
          print("lossless crossing candidate smoke test passed")
          PY

      - name: Verify hosted routing toolchain
        shell: bash
        run: |
          set -euo pipefail
          osmium --version | head -n1

          docker pull ghcr.io/valhalla/valhalla:3.6.3
          docker run --rm ghcr.io/valhalla/valhalla:3.6.3 sh -lc '
            set -eu
            for tool in               valhalla_build_config               valhalla_build_timezones               valhalla_build_admins               valhalla_build_tiles               valhalla_build_extract               valhalla_service; do
              command -v "$tool" >/dev/null
              echo "found $tool"
            done
          '
