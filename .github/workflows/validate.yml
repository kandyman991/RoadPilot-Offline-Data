name: Validate offline-data repository

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/build-routing-pack.yml"
      - ".github/workflows/publish-overture-pack.yml"
      - "requirements-routing.txt"
      - "requirements-visual.txt"
      - "requirements-search.txt"
      - "visual/**"
      - "search/**"
      - "docs/routing-packs-v1.md"
      - "docs/visual-packs-v1.md"
      - "docs/search-packs-v1.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install routing Python dependencies
        run: python -m pip install -r requirements-routing.txt

      - name: Install visual Python dependencies
        run: python -m pip install -r requirements-visual.txt

      - name: Install search Python dependencies
        run: python -m pip install -r requirements-search.txt

      - name: Install visual smoke tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            osmium-tool \
            build-essential \
            cmake \
            liblua5.3-dev \
            libsqlite3-dev \
            libshp-dev \
            libboost-program-options-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            rapidjson-dev

      - name: Build pinned tilemaker 3.2.0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tilemaker-v3.2.0"
          git clone --filter=blob:none https://github.com/systemed/tilemaker.git "$root"
          git -C "$root" checkout --detach c7d1dbfaf87baa9e0bc9b2e984e0dae90dcf00c5
          cmake -S "$root" -B "$root/build" -DCMAKE_BUILD_TYPE=Release -DBoost_USE_DEBUG_RUNTIME=OFF
          cmake --build "$root/build" --target tilemaker --parallel 2
          "$root/build/tilemaker" --help | head -n 1

      - name: Compile Python tooling
        run: python -m py_compile tools/*.py

      - name: Regression-test Valhalla semantic version parsing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re

          pattern = re.compile(r"(?<!\d)(\d+\.\d+\.\d+)(?!\d)")
          samples = {
              "3.6.3": "3.6.3",
              "[INFO] wrapper\n3.6.3\n": "3.6.3",
              "valhalla 3.6.3": "3.6.3",
          }
          for output, expected in samples.items():
              match = pattern.search(output)
              actual = match.group(1) if match else None
              assert actual == expected, (output, actual, expected)
          print("Valhalla semantic-version parsing regression passed")
          PY

      - name: Regression-test pyvalhalla service wrapper output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.build_routing_region import parse_valhalla_service_json

          payload = '{"trip":{"status":0,"summary":{"length":12.3}}}'
          launcher = "[INFO] Running /tmp/valhalla/bin/valhalla_service with args: ['config', 'route', '{...}']..."

          for output in (
              payload,
              payload + "\n" + launcher + "\n",
              launcher + "\n" + payload + "\n",
          ):
              parsed = parse_valhalla_service_json(output, "smoke")
              assert parsed["trip"]["status"] == 0
              assert parsed["trip"]["summary"]["length"] == 12.3

          print("pyvalhalla service wrapper JSON regression passed")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root in ("config", "schemas"):
              for path in Path(root).rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print("valid JSON:", path)
          PY

      - name: Validate region configs
        shell: bash
        run: |
          set -euo pipefail
          for file in config/regions/*.json; do
            python tools/validate_region_config.py --config "$file"
          done

      - name: Shared Geofabrik PBF cache regression tests
        run: python3 -m unittest discover -s tests -p 'test_source_cache.py'

      - name: Reusable buffered OSM and admin-context cache regression tests
        run: python3 -m unittest discover -s tests -p 'test_prepared_region_cache.py'

      - name: Regression-test overlapping Geofabrik regions and actual Osmium merge/extract
        run: python -m unittest discover -s tests -p 'test_geofabrik_overlaps.py'

      - name: Regression-test automatic Geofabrik setup and real Valhalla crossing proof
        run: python -m unittest discover -s tests -p 'test_graph_studio_auto_build.py'

      - name: Smoke-test retained RoadPilot search pack
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/search-pack-smoke"
          mkdir -p "$root"

          cat > "$root/places.geojsonseq" <<'JSONL'
          {"type":"Feature","id":"sarp","properties":{"id":"sarp","names":{"primary":"SARP"},"addresses":[{"freeform":"Via Colombara 10","postcode":"35018","locality":"San Martino di Lupari","region":"Veneto","country":"IT"}],"confidence":0.96,"operating_status":"open","basic_category":"manufacturer","taxonomy":{"primary":"industrial_manufacturer","hierarchy":["services_and_business","manufacturer","industrial_manufacturer"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"sarp","version":"1","confidence":0.96}]},"geometry":{"type":"Point","coordinates":[11.793,45.645]}}
          {"type":"Feature","id":"priamo","properties":{"id":"priamo","names":{"primary":"Priamo Food Technologies"},"addresses":[{"freeform":"Via Roma 1","locality":"Nervesa della Battaglia","region":"Veneto","country":"IT"}],"confidence":0.94,"operating_status":"open","basic_category":"manufacturer","taxonomy":{"primary":"industrial_manufacturer","hierarchy":["services_and_business","manufacturer","industrial_manufacturer"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"priamo","version":"1","confidence":0.94}]},"geometry":{"type":"Point","coordinates":[12.200,45.820]}}
          {"type":"Feature","id":"tecalit","properties":{"id":"tecalit","names":{"primary":"Tecalit Food Technologies"},"addresses":[{"freeform":"Via Industria 2","locality":"San Martino di Lupari","region":"Veneto","country":"IT"}],"confidence":0.92,"operating_status":"open","basic_category":"manufacturer","taxonomy":{"primary":"industrial_manufacturer","hierarchy":["services_and_business","manufacturer","industrial_manufacturer"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"tecalit","version":"1","confidence":0.92}]},"geometry":{"type":"Point","coordinates":[11.850,45.650]}}
          {"type":"Feature","id":"caffe-1","properties":{"id":"caffe-1","names":{"primary":"Caffè Roma"},"addresses":[{"freeform":"Piazza Roma 5","locality":"Treviso","region":"Veneto","country":"IT"}],"confidence":0.90,"operating_status":"open","basic_category":"cafe","taxonomy":{"primary":"cafe","hierarchy":["food_and_drink","cafe"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"caffe-1","version":"1","confidence":0.90}]},"geometry":{"type":"Point","coordinates":[12.243,45.666]}}
          {"type":"Feature","id":"caffe-2","properties":{"id":"caffe-2","names":{"primary":"CAFFE ROMA"},"addresses":[{"freeform":"Piazza Roma 5","locality":"Treviso","region":"Veneto","country":"IT"}],"confidence":0.60,"operating_status":"open","basic_category":"cafe","taxonomy":{"primary":"cafe","hierarchy":["food_and_drink","cafe"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"caffe-2","version":"1","confidence":0.60}]},"geometry":{"type":"Point","coordinates":[12.243,45.666]}}
          {"type":"Feature","id":"gas-near","properties":{"id":"gas-near","names":{"primary":"RoadPilot Fuel Near"},"addresses":[{"freeform":"Via Test 1","locality":"Treviso","region":"Veneto","country":"IT"}],"confidence":0.75,"operating_status":"open","basic_category":"gas_station","taxonomy":{"primary":"gas_station","hierarchy":["travel_and_transportation","automotive","gas_station"],"alternates":["convenience_store"]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"gas-near","version":"1","confidence":0.75}]},"geometry":{"type":"Point","coordinates":[12.105,45.805]}}
          {"type":"Feature","id":"gas-far","properties":{"id":"gas-far","names":{"primary":"RoadPilot Fuel Far"},"addresses":[{"freeform":"Via Test 99","locality":"Verona","region":"Veneto","country":"IT"}],"confidence":0.99,"operating_status":"open","basic_category":"gas_station","taxonomy":{"primary":"gas_station","hierarchy":["travel_and_transportation","automotive","gas_station"],"alternates":[]},"sources":[{"provider":"Synthetic","resource":"fixture","record_id":"gas-far","version":"1","confidence":0.99}]},"geometry":{"type":"Point","coordinates":[11.000,45.000]}}
          JSONL

          cat > "$root/region.json" <<'JSON'
          {
            "schemaVersion": 1,
            "id": "search-smoke",
            "name": "Search Smoke",
            "overture": {
              "enabled": true,
              "country": "IT",
              "databaseSchema": "roadpilot-overture-v1",
              "fileName": "search-smoke-v1.sqlite",
              "manifestFileName": "search-smoke-v1.json",
              "coverage": {
                "minLat": 45.0,
                "maxLat": 46.5,
                "minLng": 11.0,
                "maxLng": 13.0
              },
              "validation": [
                {
                  "nameEquals": "SARP",
                  "query": "SARP Food Technologies",
                  "addressContainsAny": ["san martino di lupari", "colombara"],
                  "limit": 8
                },
                {
                  "nameEquals": "Caffè Roma",
                  "query": "Caffe Roma",
                  "addressContainsAny": ["treviso"],
                  "limit": 8
                }
              ]
            }
          }
          JSON

          python tools/validate_region_config.py --config "$root/region.json"

          common=(
            --config "$root/region.json"
            --input "$root/places.geojsonseq"
            --source-release "2026-09-23.1"
            --pack-version "1.0.0"
          )

          python tools/build_search_region_pack.py \
            "${common[@]}" \
            --dist-dir "$root/dist-a" \
            --work-dir "$root/work-a"

          python tools/build_search_region_pack.py \
            "${common[@]}" \
            --dist-dir "$root/dist-b" \
            --work-dir "$root/work-b"

          pack_a="$root/dist-a/search-smoke/1.0.0"
          pack_b="$root/dist-b/search-smoke/1.0.0"
          db_a="$pack_a/search-smoke-v1.sqlite"
          db_b="$pack_b/search-smoke-v1.sqlite"
          manifest_a="$pack_a/search-smoke-v1.json"

          cmp "$db_a" "$db_b"

          python tools/validate_search_pack.py \
            --manifest "$manifest_a" \
            --database "$db_a" \
            --config "$root/region.json"

          python tools/roadpilot_search_v1.py \
            --database "$db_a" \
            --query "SARP Food Technologies" \
            --limit 8 \
            --json > "$root/runtime-results.json"

          python tools/roadpilot_search_v2.py \
            --database "$db_a" \
            --category "gas station" \
            --origin-lat 45.805 \
            --origin-lng 12.105 \
            --limit 8 \
            --json > "$root/enhanced-results.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "search-pack-smoke"
          results = json.loads((root / "runtime-results.json").read_text())
          assert results[0]["title"] == "SARP", results
          assert results[0]["scoreBrandFirst"] == 2500
          assert results[0]["score"] > results[1]["score"]

          enhanced = json.loads((root / "enhanced-results.json").read_text())
          assert enhanced[0]["id"] == "gas-near", enhanced
          assert enhanced[0]["basicCategory"] == "gas_station"
          assert enhanced[0]["taxonomyPrimary"] == "gas_station"
          assert enhanced[0]["sourceProvider"] == "Synthetic"
          assert enhanced[0]["sourceDataset"] == "fixture"
          assert enhanced[0]["distanceMeters"] < 50
          assert enhanced[0]["scoreProximity"] > enhanced[1]["scoreProximity"]

          pack = root / "dist-a/search-smoke/1.0.0"
          manifest = json.loads((pack / "search-smoke-v1.json").read_text())
          assert manifest["schema"] == "roadpilot-search-pack"
          assert manifest["artifactKind"] == "SEARCH"
          assert manifest["databaseSchema"] == "roadpilot-overture-v1"
          assert manifest["source"]["dataRelease"] == "2026-09-23.1"
          assert manifest["source"]["clientVersion"] == "1.0.2"
          assert manifest["sourceFingerprint"].startswith("sha256:")
          assert manifest["searchFingerprint"] == "sha256:" + manifest["sha256"]
          assert manifest["validation"]["passed"] is True
          assert manifest["validation"]["targetCount"] == 2
          assert manifest["enrichment"]["schema"] == "roadpilot-search-enrichment-v2"
          assert manifest["enrichment"]["categorizedRecordCount"] == 7
          assert manifest["enrichment"]["structuredAddressRecordCount"] == 7
          assert manifest["enrichment"]["sourceIdentifiedRecordCount"] == 7
          assert "roadpilot-search-v2" in manifest["capabilities"]["runtimeContracts"]
          assert manifest["capabilities"]["categorySearch"] is True
          assert manifest["capabilities"]["proximityRanking"] is True
          sarp = manifest["validation"]["results"][0]
          assert sarp["nameEquals"] == "SARP"
          assert sarp["query"] == "SARP Food Technologies"
          assert sarp["matchedRank"] == 1
          print("search artifact/runtime contract smoke passed")
          PY

          if python tools/build_search_region_pack.py \
            "${common[@]}" \
            --dist-dir "$root/dist-a" \
            --work-dir "$root/work-a"; then
            echo "Expected retained search version overwrite to fail" >&2
            exit 1
          fi

          cp "$db_a" "$root/corrupt.sqlite"
          truncate -s 128 "$root/corrupt.sqlite"
          if python tools/validate_search_pack.py \
            --manifest "$manifest_a" \
            --database "$root/corrupt.sqlite" \
            --config "$root/region.json"; then
            echo "Expected corrupt search database validation to fail" >&2
            exit 1
          fi

      - name: Smoke-test immutable publication contract
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/publication-contract"
          store="$root/store"
          mkdir -p "$root" "$store"

          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-contract"

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def make(version, payload, folder=None):
              folder = root / (folder or version)
              folder.mkdir(parents=True, exist_ok=True)
              package_name = f"region-a-{version}.tar"
              manifest_name = f"region-a-{version}-manifest.json"
              graph_index_name = f"region-a-{version}-graph-index.json"
              package = folder / package_name

              tile = folder / "0.gph"
              index = folder / "index.bin"
              tile.write_bytes(payload)
              index.write_bytes(b"index-" + payload)
              with tarfile.open(package, "w") as archive:
                  archive.add(tile, arcname="0/0/0.gph")
                  archive.add(index, arcname="index.bin")
              tile.unlink()
              index.unlink()

              package_sha = sha(package)
              graph_index = {
                  "schema": "roadpilot-graph-index",
                  "schemaVersion": 1,
                  "regionId": "region-a",
                  "packageVersion": version,
                  "graphTileFingerprint": "sha256:" + "1" * 64,
                  "internalFingerprint": "sha256:" + "2" * 64,
                  "tileCount": 1,
                  "boundaries": [],
                  "tiles": [],
              }
              graph_index_path = folder / graph_index_name
              graph_index_path.write_text(json.dumps(graph_index, indent=2) + "\n")
              graph_index_sha = sha(graph_index_path)

              manifest = {
                  "schema": "roadpilot-routing-pack",
                  "schemaVersion": 1,
                  "regionId": "region-a",
                  "regionName": "Region A",
                  "packageVersion": version,
                  "builtAtUtc": f"2026-10-07T00:00:0{len(payload) % 10}Z",
                  "valhallaVersion": "3.6.3",
                  "graphFingerprint": "sha256:" + package_sha,
                  "source": {
                      "primaryGeofabrikId": "country/region-a",
                      "polygonUrl": "https://example.invalid/region-a.poly",
                      "borderBufferKm": 25,
                      "bufferGeoJsonSha256": "3" * 64,
                      "pbfs": [{
                          "id": "country/region-a",
                          "url": "https://example.invalid/region-a.osm.pbf",
                          "sizeBytes": 123,
                          "sha256": "4" * 64,
                      }],
                  },
                  "artifact": {
                      "fileName": package_name,
                      "sizeBytes": package.stat().st_size,
                      "sha256": package_sha,
                      "tileCount": 1,
                  },
                  "graphIndex": {
                      "fileName": graph_index_name,
                      "sha256": graph_index_sha,
                      "graphTileFingerprint": graph_index["graphTileFingerprint"],
                      "internalFingerprint": graph_index["internalFingerprint"],
                      "boundaryFingerprints": {},
                  },
                  "validation": {
                      "routes": [
                          {"name": "interior", "kind": "interior", "passed": True},
                          {"name": "border", "kind": "border", "passed": True},
                      ]
                  },
              }
              manifest_path = folder / manifest_name
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
              (folder / f"{package_name}.sha256").write_text(
                  f"{package_sha}  {package_name}\n"
              )
              return manifest_path

          make("2026.10.07-1", b"release-one")
          make("2026.10.07-2", b"poisoned-version")
          make("2026.10.07-3", b"release-three")
          # Same immutable v1 keys but different bytes: must never overwrite v1.
          make("2026.10.07-1", b"conflicting-v1", folder="conflict-v1")
          PY

          for version in 2026.10.07-1 2026.10.07-2 2026.10.07-3; do
            python tools/prepare_routing_publication.py \
              --manifest "$root/$version/region-a-$version-manifest.json" \
              --output "$root/$version-plan.json"
            python tools/validate_publication_plan.py \
              --plan "$root/$version-plan.json"
          done

          python tools/prepare_routing_publication.py \
            --manifest "$root/conflict-v1/region-a-2026.10.07-1-manifest.json" \
            --output "$root/conflict-v1-plan.json"
          python tools/validate_publication_plan.py --plan "$root/conflict-v1-plan.json"

          # Publish v1, then repeat exactly: the second pass must be idempotent.
          python tools/apply_publication_plan_local.py \
            --plan "$root/2026.10.07-1-plan.json" \
            --store-root "$store" \
            --report "$root/apply-v1.json"
          cp "$store/routing/region-a/latest.json" "$root/latest-after-v1.json"

          python tools/apply_publication_plan_local.py \
            --plan "$root/2026.10.07-1-plan.json" \
            --store-root "$store" \
            --report "$root/apply-v1-retry.json"
          cmp "$root/latest-after-v1.json" "$store/routing/region-a/latest.json"

          # Same version/key with different bytes is forbidden and cannot move latest.
          if python tools/apply_publication_plan_local.py \
            --plan "$root/conflict-v1-plan.json" \
            --store-root "$store"; then
            echo "Expected immutable v1 overwrite to be refused" >&2
            exit 1
          fi
          cmp "$root/latest-after-v1.json" "$store/routing/region-a/latest.json"

          # Seed a conflicting v2 manifest object. The publisher may stage earlier
          # immutable objects, but latest must remain v1 because confirmation fails.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-contract"
          plan = json.loads((root / "2026.10.07-2-plan.json").read_text())
          manifest_object = next(
              item for item in plan["sourceObjects"] if item["role"] == "MANIFEST"
          )
          target = root / "store" / manifest_object["key"]
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("conflicting immutable manifest\n")
          PY

          if python tools/apply_publication_plan_local.py \
            --plan "$root/2026.10.07-2-plan.json" \
            --store-root "$store"; then
            echo "Expected partial v2 publication to fail" >&2
            exit 1
          fi
          cmp "$root/latest-after-v1.json" "$store/routing/region-a/latest.json"
          test ! -f "$store/routing/region-a/2026.10.07-2/release.json"

          # A clean new version can publish and advance latest.
          python tools/apply_publication_plan_local.py \
            --plan "$root/2026.10.07-3-plan.json" \
            --store-root "$store" \
            --report "$root/apply-v3.json"

          # Roll back latest to the immutable v1 release without deleting v3.
          python tools/activate_publication_release_local.py \
            --store-root "$store" \
            --release-key "routing/region-a/2026.10.07-1/release.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "publication-contract"
          store = root / "store"

          retry = json.loads((root / "apply-v1-retry.json").read_text())
          assert all(item["state"] == "ALREADY_PRESENT" for item in retry["objectResults"])
          assert retry["release"]["state"] == "ALREADY_PRESENT"

          latest = json.loads((store / "routing/region-a/latest.json").read_text())
          assert latest["packageVersion"] == "2026.10.07-1"
          assert latest["releaseKey"] == "routing/region-a/2026.10.07-1/release.json"

          v1 = store / "routing/region-a/2026.10.07-1/release.json"
          v3 = store / "routing/region-a/2026.10.07-3/release.json"
          assert v1.is_file()
          assert v3.is_file()
          release1 = json.loads(v1.read_text())
          release3 = json.loads(v3.read_text())
          assert release1["packageVersion"] == "2026.10.07-1"
          assert release3["packageVersion"] == "2026.10.07-3"
          assert any(obj["role"] == "GRAPH_INDEX" for obj in release1["objects"])
          assert not (store / "routing/region-a/2026.10.07-2/release.json").exists()

          print("immutable publication contract smoke test passed")
          PY

      - name: Smoke-test plan-backed R2 publisher
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/publication-contract"
          python tools/smoke_r2_publication_backend.py \
            --plan-a "$root/2026.10.07-1-plan.json" \
            --plan-b "$root/2026.10.07-3-plan.json"

      - name: Smoke-test deterministic RoadPilot visual PMTiles pack
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/visual-pack-smoke"
          mkdir -p "$root/out-a" "$root/out-b"

          cat > "$root/fixture.osm" <<'OSM'
          <?xml version="1.0" encoding="UTF-8"?>
          <osm version="0.6" generator="roadpilot-ci">
            <bounds minlat="45.9950" minlon="11.9950" maxlat="46.0150" maxlon="12.0150"/>
            <node id="1" lat="46.0000" lon="12.0000" />
            <node id="2" lat="46.0000" lon="12.0100" />
            <node id="3" lat="46.0100" lon="12.0100" />
            <node id="4" lat="46.0100" lon="12.0000" />
            <node id="5" lat="46.0050" lon="12.0050">
              <tag k="place" v="city"/>
              <tag k="name" v="RoadPilot Test City"/>
              <tag k="population" v="50000"/>
            </node>
            <node id="6" lat="46.0120" lon="12.0040">
              <tag k="natural" v="peak"/>
              <tag k="name" v="RoadPilot Peak"/>
              <tag k="ele" v="1800"/>
            </node>
            <node id="7" lat="46.0030" lon="12.0020" />
            <node id="8" lat="46.0070" lon="12.0080" />
            <node id="9" lat="45.9980" lon="12.0040" />
            <node id="10" lat="46.0120" lon="12.0040" />
            <node id="11" lat="46.0020" lon="12.0020" />
            <node id="12" lat="46.0020" lon="12.0060" />
            <node id="13" lat="46.0060" lon="12.0060" />
