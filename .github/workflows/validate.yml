name: Validate offline-data repository

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/build-routing-pack.yml"
      - "requirements-routing.txt"
      - "docs/routing-packs-v1.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install routing Python dependencies
        run: python -m pip install -r requirements-routing.txt

      - name: Compile Python tooling
        run: python -m py_compile tools/*.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root in ("config", "schemas"):
              for path in Path(root).rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print("valid JSON:", path)
          PY

      - name: Validate region configs
        shell: bash
        run: |
          set -euo pipefail
          for file in config/regions/*.json; do
            python tools/validate_region_config.py --config "$file"
          done

      - name: Smoke-test Geofabrik Graph Studio discovery
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/graph-studio-geofabrik"
          python tools/graph_studio_regions.py --cache-dir "$cache" catalog > "$RUNNER_TEMP/catalog.json"
          python tools/graph_studio_regions.py --cache-dir "$cache" preview             --geofabrik-id italy/nord-est             --buffer-km 25 > "$RUNNER_TEMP/nord-est-preview.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          catalog = json.loads((root / "catalog.json").read_text())
          preview = json.loads((root / "nord-est-preview.json").read_text())

          assert any(item["id"] == "italy/nord-est" for item in catalog)
          assert preview["geofabrikId"] == "italy/nord-est"
          assert preview["borderBufferKm"] == 25
          assert any(item["primary"] and item["id"] == "italy/nord-est" for item in preview["sources"])
          assert len(preview["sources"]) > 1
          print("discovered sources:", ", ".join(item["id"] for item in preview["sources"]))
          PY

      - name: Smoke-test connectivity pair manifest
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/connectivity-pair"
          mkdir -p "$root/a" "$root/b"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "connectivity-pair"
          fp_a = "sha256:" + "a" * 64
          fp_b = "sha256:" + "b" * 64
          boundary_ab = "sha256:" + "c" * 64
          boundary_ba = "sha256:" + "d" * 64

          index_a = {
              "schema": "roadpilot-graph-index",
              "schemaVersion": 1,
              "regionId": "region-a",
              "packageVersion": "2026.10.06-a",
              "graphTileFingerprint": fp_a,
              "internalFingerprint": "sha256:" + "e" * 64,
              "tileCount": 1,
              "boundaries": [
                  {"sourceId": "country/region-b", "fingerprint": boundary_ab, "tileCount": 1}
              ],
              "tiles": [],
          }
          index_b = {
              "schema": "roadpilot-graph-index",
              "schemaVersion": 1,
              "regionId": "region-b",
              "packageVersion": "2026.10.06-b",
              "graphTileFingerprint": fp_b,
              "internalFingerprint": "sha256:" + "f" * 64,
              "tileCount": 1,
              "boundaries": [
                  {"sourceId": "country/region-a", "fingerprint": boundary_ba, "tileCount": 1}
              ],
              "tiles": [],
          }
          manifest_a = {
              "regionId": "region-a",
              "packageVersion": "2026.10.06-a",
              "graphFingerprint": fp_a,
              "source": {"primaryGeofabrikId": "country/region-a"},
              "graphIndex": {"fileName": "a-graph-index.json"},
          }
          manifest_b = {
              "regionId": "region-b",
              "packageVersion": "2026.10.06-b",
              "graphFingerprint": fp_b,
              "source": {"primaryGeofabrikId": "country/region-b"},
              "graphIndex": {"fileName": "b-graph-index.json"},
          }

          (root / "a" / "a-graph-index.json").write_text(json.dumps(index_a))
          (root / "a" / "a-manifest.json").write_text(json.dumps(manifest_a))
          (root / "b" / "b-graph-index.json").write_text(json.dumps(index_b))
          (root / "b" / "b-manifest.json").write_text(json.dumps(manifest_b))
          PY

          python tools/build_connectivity_pair_manifest.py             --from-manifest "$root/a/a-manifest.json"             --to-manifest "$root/b/b-manifest.json"             --output "$root/a__b-connectivity.json"

          python tools/validate_cross_region_connectivity.py             --artifact "$root/a__b-connectivity.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "connectivity-pair"
          artifact = json.loads((root / "a__b-connectivity.json").read_text())
          assert artifact["pairId"] == "region-a__region-b"
          assert artifact["fromBoundarySourceId"] == "country/region-b"
          assert artifact["toBoundarySourceId"] == "country/region-a"
          assert artifact["fromBoundaryFingerprint"] == "sha256:" + "c" * 64
          assert artifact["toBoundaryFingerprint"] == "sha256:" + "d" * 64
          assert artifact["bindingState"] == "STABLE_PHYSICAL"
          assert artifact["validationState"] == "UNPROVEN"
          assert artifact["candidates"] == []
          print("connectivity pair manifest smoke test passed")
          PY

      - name: Verify hosted routing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version | head -n1

          docker pull ghcr.io/valhalla/valhalla:3.6.3
          docker run --rm ghcr.io/valhalla/valhalla:3.6.3 sh -lc '
            set -eu
            for tool in               valhalla_build_config               valhalla_build_timezones               valhalla_build_admins               valhalla_build_tiles               valhalla_build_extract               valhalla_service; do
              command -v "$tool" >/dev/null
              echo "found $tool"
            done
          '
