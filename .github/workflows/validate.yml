          visual-regional
          1
            12.0000 46.0000
            12.0110 46.0000
            12.0110 46.0110
            12.0000 46.0110
            12.0000 46.0000
          END
          END
          POLY

          cat > "$root/region.json" <<'JSON'
          {
            "schemaVersion": 1,
            "id": "visual-regional",
            "name": "Visual Regional Smoke",
            "visual": {
              "enabled": true,
              "source": {
                "primaryGeofabrikId": "test/visual-regional",
                "url": "https://example.invalid/visual-regional-latest.osm.pbf",
