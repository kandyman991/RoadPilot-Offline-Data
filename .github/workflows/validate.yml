name: Validate offline-data repository

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tooling
        run: python -m py_compile tools/*.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root in ("config", "schemas"):
              for path in Path(root).rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print("valid JSON:", path)
          PY

      - name: Validate region configs
        shell: bash
        run: |
          set -euo pipefail
          for file in config/regions/*.json; do
            python tools/validate_region_config.py --config "$file"
          done
      - name: Compile-check Python tools
        run: python -m py_compile tools/*.py

      - name: Validate routing inventory fixtures
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_boundary_edge_inventory.py             --inventory tests/fixtures/austria-boundary-inventory.json
          python tools/validate_boundary_edge_inventory.py             --inventory tests/fixtures/oberbayern-boundary-inventory.json

      - name: Run routing transition tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Kufstein routing regression catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/routing-test

          python tools/build_routing_transition_candidates.py \
            --from-inventory tests/fixtures/austria-boundary-inventory.json \
            --to-inventory tests/fixtures/oberbayern-boundary-inventory.json \
            --pair-config config/routing-pairs/geofabrik-austria__geofabrik-oberbayern.json \
            --output dist/routing-test/austria__oberbayern.json

          python tools/build_routing_transition_candidates.py \
            --from-inventory tests/fixtures/oberbayern-boundary-inventory.json \
            --to-inventory tests/fixtures/austria-boundary-inventory.json \
            --pair-config config/routing-pairs/geofabrik-oberbayern__geofabrik-austria.json \
            --output dist/routing-test/oberbayern__austria.json

          python tools/validate_routing_transition_candidates.py \
            --catalog dist/routing-test/austria__oberbayern.json
          python tools/validate_routing_transition_candidates.py \
            --catalog dist/routing-test/oberbayern__austria.json

      - name: Compile bound transition fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/routing-test

          python tools/compile_bound_routing_transitions.py \
            --proof-results tests/fixtures/austria-oberbayern-proof-results.json \
            --mode MOTORCYCLE \
            --output dist/routing-test/austria__oberbayern-motorcycle-bound.json

          python tools/compile_bound_routing_transitions.py \
            --proof-results tests/fixtures/austria-oberbayern-proof-results.json \
            --mode CAR \
            --output dist/routing-test/austria__oberbayern-car-bound.json

          python tools/validate_bound_routing_transitions.py \
            --artifact dist/routing-test/austria__oberbayern-motorcycle-bound.json
          python tools/validate_bound_routing_transitions.py \
            --artifact dist/routing-test/austria__oberbayern-car-bound.json
