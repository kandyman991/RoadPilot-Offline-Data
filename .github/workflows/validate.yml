          #!/usr/bin/env python3
          import json
          import sys
          args = sys.argv[1:]
          tile_extract = args[args.index("--mjolnir-tile-extract") + 1]
          tile_dir = args[args.index("--mjolnir-tile-dir") + 1]
          print(json.dumps({"mjolnir":{"tile_extract":tile_extract,"tile_dir":tile_dir}}))
          PY
          chmod +x "$root/bin/valhalla_build_config"

          cat > "$root/bin/valhalla_service" <<'PY'
          #!/usr/bin/env python3
          import json
          import sys

          def encode_value(value):
              value = ~(value << 1) if value < 0 else (value << 1)
              chars = []
              while value >= 0x20:
                  chars.append(chr((0x20 | (value & 0x1F)) + 63))
                  value >>= 5
              chars.append(chr(value + 63))
              return "".join(chars)

          def encode_polyline(points):
              last_lat = 0
              last_lon = 0
              out = []
              for point in points:
                  lat = round(point["lat"] * 1_000_000)
                  lon = round(point["lon"] * 1_000_000)
                  out.append(encode_value(lat - last_lat))
                  out.append(encode_value(lon - last_lon))
                  last_lat, last_lon = lat, lon
              return "".join(out)

          def decode_polyline(encoded):
              index = 0
              lat = 0
              lon = 0
              points = []

              def next_value():
                  nonlocal index
                  result = 0
                  shift = 0
                  while True:
                      value = ord(encoded[index]) - 63
                      index += 1
                      result |= (value & 0x1F) << shift
                      shift += 5
                      if value < 0x20:
                          break
                  return ~(result >> 1) if result & 1 else result >> 1

              while index < len(encoded):
                  lat += next_value()
                  lon += next_value()
                  points.append({"lat": lat / 1_000_000, "lon": lon / 1_000_000})
              return points

          config = json.load(open(sys.argv[1]))
          action = sys.argv[2]
          request = json.loads(sys.argv[3])
          is_a = config["mjolnir"]["tile_extract"].endswith("/a.tar")
          base = 1000 if is_a else 2000

          if action == "route":
              start, end = request["locations"]
              costing = request["costing"]
              eastbound = end["lon"] > start["lon"]
              passed = costing == "auto" or eastbound
              if passed:
                  print(json.dumps({
                      "trip": {
                          "status": 0,
                          "status_message": "Found route between points",
                          "summary": {"length": 0.12, "time": 8},
                          "legs": [{"shape": encode_polyline([start, end])}],
                      }
                  }))
              else:
                  print(json.dumps({
                      "trip": {
                          "status": 442,
                          "status_message": "No path could be found",
                          "summary": {}
                      }
                  }))
              raise SystemExit(0)

          if action == "trace_attributes":
              points = decode_polyline(request["encoded_polyline"])
              near_frontier = sorted(
                  (
                      (abs(point["lon"] - 1.0), point)
                      for point in points
                      if abs(point["lon"] - 1.0) < 0.01
                  ),
                  key=lambda item: item[0],
              )
              if not near_frontier:
                  raise SystemExit("fake trace had no frontier endpoint")

              # The stable snippet is intentionally short, so a normal
              # crossing's interior probe can also be within 0.01 degrees of
              # the frontier. Distinguish it from FRONTIER_OVERLAP by scale:
              # normal crossing -> probe is much farther from lon=1 than snap;
              # frontier overlap -> probe lies on lon=1 and snap is the
              # non-zero offset.
              deltas = [item[0] for item in near_frontier]
              if max(deltas) > 0.001:
                  delta = min(deltas)
              else:
                  delta = max(deltas)
              if delta < 0.00005:
                  # Candidate 999 is deliberately re-correlated by the route to
                  # edge +2. This must fail exact candidate-edge proof.
                  graph_id = base + 2
                  way_id = 100
              elif delta < 0.00025:
                  graph_id = base + 2
                  way_id = 100
              else:
                  graph_id = base + 3
                  way_id = 102
              print(json.dumps({"edges": [{"id": graph_id, "way_id": way_id}]}))
              raise SystemExit(0)

          if action != "locate":
              raise SystemExit("unsupported fake Valhalla action: " + action)

          point = request["locations"][0]
          shift = 0.0002 if is_a else -0.0002

          def edge(way_id, offset, graph_id, heading):
              motorcycle = not (way_id == 100 and not is_a)
              return {
                  "edge_id": {"value": graph_id},
                  "edge_info": {
                      "way_id": way_id,
                      "names": ["Road " + str(way_id)],
                  },
                  "edge": {
                      "classification": {"classification": "primary"},
                      "access": {"car": True, "motorcycle": motorcycle},
                      "use": "road",
                  },
                  "percent_along": 0.5,
                  "heading": heading,
                  "correlated_lat": point["lat"],
                  "correlated_lon": point["lon"] + offset,
              }

          # Wrong way 999 is closest on purpose. Stable way matches must be ranked
          # first as evidence, but this wrong-way candidate must remain in output.
          result = [{
              "input_lat": point["lat"],
              "input_lon": point["lon"],
              "edges": [
                  edge(999, 0.00001, base + 1, 5),
                  edge(100, shift, base + 2, 275 if is_a else 95),
                  edge(102, shift * 1.5, base + 3, 95),
              ],
          }]
          print(json.dumps(result))
          PY
          chmod +x "$root/bin/valhalla_service"

          PATH="$root/bin:$PATH" python tools/correlate_frontier_roads.py \
            --inventory "$RUNNER_TEMP/frontier-inventory/inventory.json" \
            --from-manifest "$root/from/manifest.json" \
