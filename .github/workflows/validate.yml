          if python tools/build_visual_region_pack.py             --config "$root/region.json"             --package-version 2026.10.07-1             --work-dir "$work"             --dist-dir "$dist"             --tilemaker-bin "$RUNNER_TEMP/tilemaker-v3.2.0/build/tilemaker"; then
