name: F8 Architecture Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture-contract:
    name: architecture-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history for a trusted PR file diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal F8 regression dependencies
        run: python -m pip install "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Enforce behavioral F8 architecture regressions
        run: python -m unittest discover -s tests -p 'test_f8_architecture_regressions.py' -v

      - name: Native F8 graph-backed physical peer and incomplete-evidence regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_pair_evidence.py' -v

      - name: Exhaustive native directed GPS crossing proposal regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_crossing_discovery.py' -v

      - name: Terminal handoff evidence uncertainty and no-legacy regression checks
        run: python -m unittest discover -s tests -p 'test_native_f8_terminal_evidence_audit.py' -v

      - name: Native F8 receiver endpoint correlation and exact outgoing adjacency regressions
        run: |
          python -m unittest discover -s tests -p 'test_native_f8_receiver_topology_audit.py' -v
          python -m unittest discover -s tests -p 'test_native_f8_receiver_adjacency.py' -v

      - name: Directed native terminal source and receiver route trace proof regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_terminal_handoff_proofs.py' -v

      - name: Full directed terminal geometry observation regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_terminal_geometry.py' -v

      - name: Exact B-graph directed seam turn and uncertainty regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_directed_turn.py' -v

      - name: Selected terminal + receiving-turn journey diagnostic regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_selected_journey.py' -v

      - name: Graph-native segmented receiving-chain geometry and Valhalla trace regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_directed_chain.py' -v

      - name: Native F8 clipped-terminal buffer/adjacency evidence regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_clipped_terminal.py' -v

      - name: Actual F8 native A-last and B-first full-journey trace regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_actual_journey.py' -v

      - name: Ordered native F8 receiver proof scheduling and no-first-success regression
        run: python -m unittest discover -s tests -p 'test_native_f8_ordered_proof_batch.py' -v

      - name: Original native Valhalla build source and provenance integrity gate
        run: python -m unittest discover -s tests -p 'test_native_f8_original_build_provenance.py' -v

      - name: Original Valhalla trip protobuf edge identity and no-replay F8 regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_original_route.py' -v

      - name: Final native graph-local road-edge original-route proof regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_original_terminal.py' -v

      - name: Full native 25 km topology census and no-road-suppression gates
        run: python -m unittest discover -s tests -p 'test_native_f8_full_terminal_census.py' -v

      - name: One final directed edge candidate per GraphId and mode-union contract
        run: python -m unittest discover -s tests -p "test_native_f8_final_edge_register.py" -v

      - name: Original source-only terminal hierarchy, mode alternatives and cut geometry contract
        run: python -m unittest discover -s tests -p 'test_native_f8_final_source_hierarchy.py' -v

      - name: Original source-only cut last TripLeg and short-edge predecessor proof
        run: python -m unittest discover -s tests -p 'test_native_f8_source_cut_last_tripleg.py' -v

      - name: Original source-only beyond-cut final-edge predecessors and no first-success exclusion
        run: python -m unittest discover -s tests -p 'test_native_f8_beyond_cut_predecessor.py' -v

      - name: Original directed cut window-census and no false whole-archive completeness claims
        run: python -m unittest discover -s tests -p 'test_native_f8_original_source_cut_census.py' -v

      - name: Source cut/full predecessor coverage reconciliation and missing-GraphId fail-closed gates
        run: python -m unittest discover -s tests -p 'test_native_f8_source_cut_coverage_reconciliation.py' -v

      - name: Real final source GraphId to receiving forward physical edge contract
        run: python -m unittest discover -s tests -p 'test_f8_final_edge_connections.py' -v

      - name: Original source native last-edge and branch lineage regression gates
        run: |
          python -m unittest discover -s tests -p 'test_f8_source_final_native_topology.py' -v
          python -m unittest discover -s tests -p 'test_f8_native_last_edge_delivery.py' -v

      - name: Exhaustive original receiver archive and source way-continuation regressions
        run: python -m unittest discover -s tests -p 'test_f8_full_original_receiver_and_uncapped.py' -v

      - name: Real outward bilateral crossing-only scope and no-unrelated-roads regression
        run: python -m unittest discover -s tests -p 'test_f8_actual_bilateral_crossing_scope.py' -v

      - name: Automatic build-time bilateral graph-SHA pairing and original F8 proof gates
        run: python -m unittest discover -s tests -p 'test_f8_auto_bilateral_after_build.py' -v

      - name: Android JNI scanner cap and Kotlin road-key parity gating regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_android_jni_parity.py' -v

      - name: Bounded native F8 journey Valhalla proof regressions
        run: python -m unittest discover -s tests -p 'test_native_f8_journey_probe.py' -v

      - name: Graph Studio native F8 GUI/workspace integration regressions
        run: |
          python -m unittest discover -s tests -p 'test_graph_studio_f8_workspace.py' -v
          python -m unittest discover -s tests -p 'test_graph_studio_f8_ui_contract.py' -v

      - name: Graph Studio responsive UI foundation and durable audit regression gate
        run: python -m unittest discover -s tests -p 'test_graph_studio_ui_foundation.py' -v

      - name: Graph Studio Phase 2 navigation and comparison regression gate
        run: python -m unittest discover -s tests -p 'test_graph_studio_ui_phase2.py' -v

      - name: Graph Studio Phase 3 border/map UI regression gate
        run: python -m unittest discover -s tests -p 'test_graph_studio_ui_phase3.py' -v

      - name: Native F8 directed-edge parity-audit contract regressions
        run: python -m unittest discover -s tests -p 'test_f8_graph_edge_audit.py' -v

      - name: Uncapped native graph capture window regression checks
        run: python -m unittest discover -s tests -p 'test_native_f8_capture_windows.py' -v

      - name: Enforce architecture review and evidence for protected PR changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/architecture-changed-files.txt"
          python tools/check_architecture_contract.py \
            --changed-files "$RUNNER_TEMP/architecture-changed-files.txt"
