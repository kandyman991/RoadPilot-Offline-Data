name: Publish RoadPilot Overture Sidecar Pack

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id"
        required: true
        default: "italy-nord-est"
        type: string
      pack_version:
        description: "Logical pack version (blank uses run/commit)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "config/regions/**"
      - "tools/build_overture_places_pack.py"
      - "tools/build_overture_manifest.py"
      - "tools/validate_overture_pack.py"
      - "tools/roadpilot_search_v1.py"
      - "tools/validate_search_pack.py"
      - "schemas/search-*.schema.json"
      - "search/overture/toolchain.json"
      - "requirements-search.txt"
      - ".github/workflows/publish-overture-pack.yml"
  pull_request:
    paths:
      - "config/regions/**"
      - "tools/build_overture_places_pack.py"
      - "tools/build_overture_manifest.py"
      - "tools/validate_overture_pack.py"
      - "tools/roadpilot_search_v1.py"
      - "tools/validate_search_pack.py"
      - "schemas/search-*.schema.json"
      - "search/overture/toolchain.json"
      - "requirements-search.txt"
      - ".github/workflows/publish-overture-pack.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: roadpilot-overture-packs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve region configuration
        id: region
        shell: bash
        env:
          REQUESTED_REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          REGION="${REQUESTED_REGION:-italy-nord-est}"
          CONFIG="config/regions/${REGION}.json"
          test -f "$CONFIG"
          python tools/validate_region_config.py --config "$CONFIG"

          REGION_ID="$(jq -r '.id' "$CONFIG")"
          COUNTRY="$(jq -r '.overture.country' "$CONFIG")"
          FILE_NAME="$(jq -r '.overture.fileName' "$CONFIG")"
          MANIFEST_NAME="$(jq -r '.overture.manifestFileName' "$CONFIG")"
          MIN_LAT="$(jq -r '.overture.coverage.minLat' "$CONFIG")"
          MAX_LAT="$(jq -r '.overture.coverage.maxLat' "$CONFIG")"
          MIN_LNG="$(jq -r '.overture.coverage.minLng' "$CONFIG")"
          MAX_LNG="$(jq -r '.overture.coverage.maxLng' "$CONFIG")"
          BBOX="${MIN_LNG},${MIN_LAT},${MAX_LNG},${MAX_LAT}"

          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "region_id=$REGION_ID" >> "$GITHUB_OUTPUT"
          echo "country=$COUNTRY" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$MANIFEST_NAME" >> "$GITHUB_OUTPUT"
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"

      - name: Download pinned current Overture Places
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-search.txt
          CLIENT_VERSION="$(jq -r '.overturemapsVersion' search/overture/toolchain.json)"
          python -m pip install "overturemaps==$CLIENT_VERSION"
          INSTALLED_VERSION="$(python - <<'PY'
          import importlib.metadata
          print(importlib.metadata.version("overturemaps"))
          PY
          )"
          test "$INSTALLED_VERSION" = "$CLIENT_VERSION"

          OVERTURE_RELEASE="$(python - <<'PY'
          import json
          import urllib.request
          request = urllib.request.Request(
              "https://stac.overturemaps.org/catalog.json",
              headers={"User-Agent": "RoadPilot-Offline-Data/search-builder"},
          )
          with urllib.request.urlopen(request) as response:
              value = json.load(response)
          latest = str(value.get("latest") or "").strip().strip("/")
          if not latest:
              raise SystemExit("Overture STAC catalog did not expose latest release")
          print(latest)
          PY
          )"
          echo "OVERTURE_CLIENT_VERSION=$CLIENT_VERSION" >> "$GITHUB_ENV"
          echo "OVERTURE_RELEASE=$OVERTURE_RELEASE" >> "$GITHUB_ENV"
          echo "Overture client: $CLIENT_VERSION"
          echo "Overture data release: $OVERTURE_RELEASE"

          mkdir -p "$RUNNER_TEMP/overture"
          OUTPUT="$RUNNER_TEMP/overture/places.geojsonseq"
          rm -f "$OUTPUT"
          overturemaps download \
            --bbox="${{ steps.region.outputs.bbox }}" \
            --type=place \
            -f geojsonseq \
            -o "$OUTPUT" || true

          if [ ! -s "$OUTPUT" ]; then
            echo "STAC-backed Overture query produced no data; retrying without STAC."
            rm -f "$OUTPUT"
            overturemaps download \
              --no-stac \
              --bbox="${{ steps.region.outputs.bbox }}" \
              --type=place \
              -f geojsonseq \
              -o "$OUTPUT"
          fi

          test -s "$OUTPUT"

      - name: Build compact regional SQLite pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/overture
          python tools/build_overture_places_pack.py \
            --input "$RUNNER_TEMP/overture/places.geojsonseq" \
            --output "dist/overture/${{ steps.region.outputs.file_name }}" \
            --region-id "${{ steps.region.outputs.region_id }}" \
            --country "${{ steps.region.outputs.country }}" \
            --source-release "$OVERTURE_RELEASE" \
            --source-client-version "$OVERTURE_CLIENT_VERSION"
          test -s "dist/overture/${{ steps.region.outputs.file_name }}"

      - name: Validate pack regression targets
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_overture_pack.py \
            --database "dist/overture/${{ steps.region.outputs.file_name }}" \
            --config "${{ steps.region.outputs.config }}" \
            --report "dist/overture/search-validation.json"

      - name: Build distributable manifest
        shell: bash
        env:
          REQUESTED_PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          set -euo pipefail
          PACK_VERSION="${REQUESTED_PACK_VERSION:-}"
          if [ -z "$PACK_VERSION" ]; then
            PACK_VERSION="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          fi

          python tools/build_overture_manifest.py \
            --database "dist/overture/${{ steps.region.outputs.file_name }}" \
            --output "dist/overture/${{ steps.region.outputs.manifest_name }}" \
            --config "${{ steps.region.outputs.config }}" \
            --pack-version "$PACK_VERSION" \
            --validation-report "dist/overture/search-validation.json"

          sha256sum "dist/overture/${{ steps.region.outputs.file_name }}" \
            > "dist/overture/${{ steps.region.outputs.file_name }}.sha256"

          python tools/validate_search_pack.py \
            --manifest "dist/overture/${{ steps.region.outputs.manifest_name }}" \
            --database "dist/overture/${{ steps.region.outputs.file_name }}" \
            --config "${{ steps.region.outputs.config }}"
          ls -lh dist/overture

      - name: Publish public release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "RoadPilot Overture sidecar packs" \
              --notes "Public regional Overture Places packs for RoadPilot. These assets are not bundled in the RoadPilot APK."
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/overture/${{ steps.region.outputs.file_name }}" \
            "dist/overture/${{ steps.region.outputs.file_name }}.sha256" \
            "dist/overture/${{ steps.region.outputs.manifest_name }}" \
            --clobber
