name: Build RoadPilot Graph Studio

on:
  pull_request:
    paths:
      - "graph-studio/**"
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - "requirements-routing.txt"
      - "requirements-visual.txt"
      - "requirements-search.txt"
      - "visual/**"
      - "search/**"
      - ".github/workflows/graph-studio.yml"
      - ".github/workflows/graph-studio-release.yml"
  push:
    branches: [main]
    paths:
      - "graph-studio/**"
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - "requirements-routing.txt"
      - "requirements-visual.txt"
      - "requirements-search.txt"
      - "visual/**"
      - "search/**"
      - ".github/workflows/graph-studio.yml"
      - ".github/workflows/graph-studio-release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release governance regression tests
        run: python3 -m unittest discover -s tests -p 'test_graph_studio_release_governance.py'

      - name: Catalog startup regression tests
        run: python3 -m unittest discover -s tests -p 'test_graph_studio_catalog.py'

      - name: Independent Search/POI producer regression (Italy and Austria)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "jsonschema==4.25.1"
          python3 -m unittest discover -s tests -p 'test_graph_studio_search_producer.py' -v

      - name: Original-native private catalog integrity regression tests
        run: python3 -m unittest discover -s tests -p 'test_graph_studio_private_catalog_workflow.py' -v

      - name: Native-F8 retirement regression checks
        run: python3 -m unittest discover -s tests -p 'test_f8_architecture_regressions.py'

      - name: Shared Geofabrik PBF cache regression tests
        run: python3 -m unittest discover -s tests -p 'test_source_cache.py'

      - name: Reusable buffered OSM and admin-context cache regression tests
        run: python3 -m unittest discover -s tests -p 'test_prepared_region_cache.py'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: graph-studio
        run: npm install --package-lock-only && npm ci

      - name: Build frontend
        working-directory: graph-studio
        run: npm run build

      - name: Generate Graph Studio icons
        working-directory: graph-studio
        run: npm run prepare:icons

      - name: Compile Tauri backend
        working-directory: graph-studio/src-tauri
        run: cargo check --locked || cargo check

      - name: AI control read-only Rust contract tests
        working-directory: graph-studio/src-tauri
        run: cargo test --lib

      - name: Build AppImage and Debian packages
        working-directory: graph-studio
        run: npm run tauri build -- --bundles appimage,deb

      - name: Verify Graph Studio packages
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find graph-studio/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          DEB="$(find graph-studio/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -s "$APPIMAGE"
          test -s "$DEB"
          echo "GRAPH_STUDIO_APPIMAGE=$APPIMAGE" >> "$GITHUB_ENV"
          echo "GRAPH_STUDIO_DEB=$DEB" >> "$GITHUB_ENV"
          ls -lh "$APPIMAGE" "$DEB"
          # Both officially packaged formats must include the exact CLI
          # that the new native UI commands invoke, plus the pinned source
          # acquisition contract. No installed toolchain or source download
          # is needed during this static packaged-resource audit.
          dpkg-deb --contents "$DEB" | grep "pipeline/tools/graph_studio_search_producer.py"
          dpkg-deb --contents "$DEB" | grep "pipeline/requirements-search.txt"
          # New original D-017 private-native GUI requires both the thin
          # orchestrator and canonical pinned original Valhalla reader
          # source in the installed binary, not only the source checkout.
          dpkg-deb --contents "$DEB" | grep "pipeline/tools/graph_studio_private_catalog_workflow.py"
          dpkg-deb --contents "$DEB" | grep "pipeline/tools/native-f8-boundary-final/native_f8_boundary_final_edges.cpp"
          dpkg-deb --contents "$DEB" | grep "pipeline/schemas/f8-graph-studio-native-private-catalog.schema.json"
          EXTRACT_DIR="$(mktemp -d)"
          (
            cd "$EXTRACT_DIR"
            "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null
            test -s squashfs-root/usr/lib/roadpilot-graph-studio/pipeline/tools/graph_studio_search_producer.py ||
              test -n "$(find squashfs-root -type f -path '*/pipeline/tools/graph_studio_search_producer.py' -print -quit)"
            test -n "$(find squashfs-root -type f -path '*/pipeline/requirements-search.txt' -print -quit)"
            test -n "$(find squashfs-root -type f -path '*/pipeline/tools/graph_studio_private_catalog_workflow.py' -print -quit)"
            test -n "$(find squashfs-root -type f -path '*/pipeline/tools/native-f8-boundary-final/native_f8_boundary_final_edges.cpp' -print -quit)"
            test -n "$(find squashfs-root -type f -path '*/pipeline/schemas/f8-graph-studio-native-private-catalog.schema.json' -print -quit)"
          )
          rm -rf "$EXTRACT_DIR"

      - name: Retain short-lived review packages for owner-only Linux desktop acceptance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: graph-studio-pr-linux-review-packages
          path: |
            graph-studio/src-tauri/target/release/bundle/appimage/*.AppImage
            graph-studio/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
